<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>skillforge — Dashboard</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14181d;
    --border: #232a32;
    --text: #e6edf3;
    --dim: #8b96a3;
    --accent: #ffa657;
    --good: #5dd577;
    --warn: #ff7b72;
    --link: #79c0ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .status { font-size: 12px; color: var(--dim); }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; }
  .status .dot.off { background: var(--warn); }
  main {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 16px;
    padding: 16px 24px;
    height: calc(100vh - 57px);
    overflow: hidden;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel h2 {
    margin: 0;
    padding: 12px 16px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--dim);
    border-bottom: 1px solid var(--border);
  }
  .panel-body { padding: 12px 16px; overflow-y: auto; flex: 1; }
  .feed-item {
    padding: 12px;
    border-radius: 6px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .feed-item .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-bottom: 8px; }
  .feed-item .prompt { color: var(--text); margin-bottom: 8px; line-height: 1.4; }
  .feed-item .reasoning { color: var(--dim); font-size: 12px; font-style: italic; margin-top: 6px; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    margin: 2px 4px 2px 0;
    border-radius: 4px;
    font-size: 11px;
    font-family: ui-monospace, monospace;
    background: rgba(255,166,87,0.12);
    color: var(--accent);
    border: 1px solid rgba(255,166,87,0.3);
  }
  .pill.candidate {
    background: rgba(121,192,255,0.08);
    color: var(--link);
    border-color: rgba(121,192,255,0.2);
  }
  .pill.reroute {
    background: rgba(255,123,114,0.15);
    color: var(--warn);
    border-color: rgba(255,123,114,0.4);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
  th { color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; position: sticky; top: 0; background: var(--panel); }
  td.num { text-align: right; font-family: ui-monospace, monospace; }
  .weight.pos { color: var(--good); }
  .weight.neg { color: var(--warn); }
  .empty { text-align: center; color: var(--dim); padding: 40px 20px; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
  .stat .num { font-size: 22px; font-weight: 600; }
  .stat .lbl { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>skillforge</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status-text">Connecting…</span></div>
</header>
<main>
  <div class="panel">
    <h2>Live routing feed</h2>
    <div class="panel-body" id="feed">
      <div class="empty">Waiting for events… send a request to <code>/chat</code></div>
    </div>
  </div>
  <div class="panel">
    <h2>Skill stats (learning weights)</h2>
    <div class="panel-body">
      <div class="stat-grid">
        <div class="stat"><div class="num" id="stat-total">—</div><div class="lbl">Skills loaded</div></div>
        <div class="stat"><div class="num" id="stat-routes">0</div><div class="lbl">Routes this session</div></div>
        <div class="stat"><div class="num" id="stat-reroutes">0</div><div class="lbl">Mid-conv reroutes</div></div>
        <div class="stat"><div class="num" id="stat-avg-ms">—</div><div class="lbl">Avg route ms</div></div>
      </div>
      <table>
        <thead><tr><th>Skill</th><th class="num">Uses</th><th class="num">Ref</th><th class="num">Weight</th></tr></thead>
        <tbody id="skills-tbody"></tbody>
      </table>
    </div>
  </div>
</main>
<script>
  const feed = document.getElementById('feed');
  const tbody = document.getElementById('skills-tbody');
  const statRoutes = document.getElementById('stat-routes');
  const statReroutes = document.getElementById('stat-reroutes');
  const statAvgMs = document.getElementById('stat-avg-ms');
  const statTotal = document.getElementById('stat-total');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('status-text');

  let routes = 0, reroutes = 0, totalMs = 0;

  function fmt(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString();
  }

  function renderEvent(ev) {
    if (ev.type !== 'route') return;
    routes++;
    if (ev.rerouted) reroutes++;
    totalMs += ev.route_ms || 0;
    statRoutes.textContent = routes;
    statReroutes.textContent = reroutes;
    statAvgMs.textContent = Math.round(totalMs / routes) + ' ms';

    const empty = feed.querySelector('.empty');
    if (empty) empty.remove();

    const div = document.createElement('div');
    div.className = 'feed-item';
    const pickedPills = ev.picked.map(n => `<span class="pill">${n}</span>`).join('') || '<span style="color:var(--dim);font-size:12px">No skills selected</span>';
    const candidatePills = ev.candidates.slice(0, 5)
      .filter(c => !ev.picked.includes(c.name))
      .map(c => `<span class="pill candidate">${c.name} ${c.score.toFixed(2)}</span>`).join('');

    div.innerHTML = `
      <div class="meta">
        <span>${fmt(ev.ts)} • session ${ev.session_id.slice(0,8)} • ${ev.route_ms}ms ${ev.rerouted ? '<span class="pill reroute">REROUTE Δ'+ev.change_pct+'%</span>' : ''}</span>
      </div>
      <div class="prompt">${escapeHtml(ev.prompt)}</div>
      <div>${pickedPills}</div>
      ${candidatePills ? `<div style="margin-top:6px;font-size:11px;color:var(--dim)">Considered: ${candidatePills}</div>` : ''}
      ${ev.reasoning ? `<div class="reasoning">${escapeHtml(ev.reasoning)}</div>` : ''}
    `;
    feed.insertBefore(div, feed.firstChild);
    while (feed.children.length > 50) feed.removeChild(feed.lastChild);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
  }

  async function refreshSkills() {
    try {
      const r = await fetch('/skills');
      const skills = await r.json();
      statTotal.textContent = skills.length;
      tbody.innerHTML = '';
      for (const s of skills.slice(0, 25)) {
        const wClass = s.weight > 0.01 ? 'pos' : s.weight < -0.01 ? 'neg' : '';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td title="${escapeHtml(s.description)}">${s.name}</td>
          <td class="num">${s.uses}</td>
          <td class="num">${s.referenced}</td>
          <td class="num weight ${wClass}">${s.weight.toFixed(3)}</td>`;
        tbody.appendChild(tr);
      }
    } catch (e) {}
  }

  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => { dot.classList.remove('off'); statusText.textContent = 'Connected'; };
    ws.onmessage = e => { try { renderEvent(JSON.parse(e.data)); } catch {} };
    ws.onclose = () => {
      dot.classList.add('off'); statusText.textContent = 'Reconnecting…';
      setTimeout(connectWS, 2000);
    };
  }

  connectWS();
  refreshSkills();
  setInterval(refreshSkills, 5000);
</script>
</body>
</html>
