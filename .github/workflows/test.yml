name: test

on: [push, pull_request]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Check JavaScript syntax
        run: |
          node --check bin/cli.js
          node --check lib/packs.js
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Check Python syntax
        run: |
          python3 -m py_compile python/app/main.py
          python3 -m py_compile python/app/cli.py
          python3 -m py_compile python/app/mcp_server.py
          python3 -m py_compile python/app/auth.py
      
      - name: Verify skills
        run: |
          SKILLS=$(find skills -name 'SKILL.md' | wc -l | tr -d ' ')
          echo "✓ Found $SKILLS skills"
          if [ "$SKILLS" -lt 200 ]; then
            echo "✗ Expected at least 200 skills"
            exit 1
          fi
