name: Skillforge release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/

      - name: Verify tag matches package.json version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_VER="${TAG_NAME#v}"
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Tag $TAG_NAME does not match package.json version $PKG_VER"
            exit 1
          fi
          echo "Version $PKG_VER matches tag $TAG_NAME"

      - name: Strip publish-only cruft from tree
        run: |
          find skills -type d -name tests -print0 | xargs -0 rm -rf || true
          rm -rf python/app/__pycache__

      - name: Create npm tarball
        run: npm pack

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Skillforge ${{ github.ref_name }}
          files: heytherevibin-skillforge-*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
