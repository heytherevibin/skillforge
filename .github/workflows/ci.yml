name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

      - name: Check JavaScript syntax
        run: |
          node --check bin/cli.js
          node --check lib/packs.js
          node --check lib/user-env-profile.js
          node --check lib/help-content.js
          node --check lib/help-render.js

      - name: Run npm test script
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: |
          for f in python/app/replay_cli.py python/app/main.py python/app/router_mode.py python/app/mcp_server.py python/app/events_cli.py python/app/materialize.py python/app/db_paths.py python/app/route_cli.py python/app/mcp_contract.py python/app/route_decision_trace.py python/app/route_eval_ingest.py python/app/chunking.py python/app/project_index.py python/app/index_cli.py python/app/context_fusion.py python/app/redaction.py python/app/route_policies.py python/app/route_policy_shadow.py python/app/route_memories.py python/app/explain_route.py python/app/tools_cli.py python/app/weight_semantics.py python/app/events_query.py python/app/router_llm.py python/app/routing_signals.py python/app/route_quality.py python/app/route_eval_harness.py python/app/eval_cli.py python/app/health_cli.py python/app/feedback_meta.py python/app/weights_cli.py python/app/verify_route_memory_cli.py; do
            python3 -m py_compile "$f"
          done

      - name: Python unit tests (db_paths)
        run: |
          pip install -r python/requirements.txt -r python/requirements-dev.txt
          cd python && PYTHONPATH=. pytest tests/ -q && PYTHONPATH=. python3 -m app.verify_route_memory_cli

      - name: Skillforge health + route eval (embedding)
        env:
          SKILLFORGE_BUNDLED_SKILLS: ${{ github.workspace }}/skills
        run: |
          cd python && PYTHONPATH=. python3 -m app.health_cli --quick && \
          PYTHONPATH=. python3 -m app.eval_cli --fixture fixtures/route_eval/smoke.json

      - name: Verify skills bundle
        run: |
          MIN=$(node -e "const j=require('./ci/bundle-gate.json'); if(typeof j.minSkillMdFiles!=='number'||j.minSkillMdFiles<1) process.exit(1); process.stdout.write(String(j.minSkillMdFiles))")
          SKILLS=$(find skills -name 'SKILL.md' -print | wc -l | tr -d ' ')
          echo "Found $SKILLS SKILL.md files (minimum: $MIN from ci/bundle-gate.json)"
          if [ "$SKILLS" -lt "$MIN" ]; then
            echo "::error::Expected at least $MIN SKILL.md files per ci/bundle-gate.json, found $SKILLS"
            exit 1
          fi
